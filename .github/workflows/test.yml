name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: test -x /usr/bin/google-chrome
      - run: npm run check
        env:
          BABALON_TEST_CHROMIUM: /usr/bin/google-chrome
